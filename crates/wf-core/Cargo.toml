[package]
name = "wf-core"
description = "Wayfarer shell engine: Win32 hooks, window tracking, DWM composition, drag math."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "wf_core"
# cdylib -> wf_core.dll + import lib, consumed by Qt through include/wf_core.h.
# rlib   -> lets us write Rust unit tests without going through the C ABI.
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
